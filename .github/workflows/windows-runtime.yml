name: Windows runtime

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-cpu:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            constraints/windows-py310.txt
      - name: Install CPU PyTorch and Windows dependencies
        run: |
          python -m pip install torch==2.6.0+cpu --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements-windows.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-deps -e .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate native DSS, actual rollout, spawn workers, and HAPPO update
        run: python scripts/check_runtime.py --train
      - name: Run Windows regression tests
        run: python -m pytest tests/test_windows_runtime.py tests/test_powergrid_session.py tests/test_config_pipeline.py tests/test_unified_config.py -o addopts="" -q
