# PowerZoo CI/CD Pipeline
# ============================================================================
# Comprehensive testing, linting, type checking, and security scanning
# Optimized with caching and parallel job execution
# ============================================================================

name: PowerZoo CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]
  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION_PRIMARY: "3.10"

jobs:
  # ==========================================================================
  # Job 1: Code Quality Checks (Fast)
  # ==========================================================================
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION_PRIMARY }}
          cache: 'pip'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black mypy

      - name: Check code formatting with Black
        run: |
          black --check --diff --color . || echo "::warning::Code formatting issues found. Run 'black .' to fix."

      - name: Lint with flake8 (syntax errors)
        run: |
          # Stop build on Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics \
            --exclude=.git,.venv,.Codex,archive,__pycache__,build,dist,*.egg-info,node_systems,data,results,htmlcov

      - name: Lint with flake8 (code style)
        run: |
          # Warnings only - don't fail the build
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics \
            --exclude=.git,.venv,.Codex,archive,__pycache__,build,dist,*.egg-info,node_systems,data,results,htmlcov

  # ==========================================================================
  # Job 2: Active regression tests with native DSS and coverage
  # ==========================================================================
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint  # Only run if lint passes
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install --no-deps -e .
          python -m pip check

      - name: Run all active regression tests
        run: |
          python -m pytest tests/ -v \
            --cov=envs --cov=algorithms --cov=runners --cov=utils --cov=common --cov=models \
            --cov-report=xml \
            --cov-report=term-missing

      - name: Validate native DSS, spawn workers, and HAPPO update
        run: python scripts/check_runtime.py --train

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.10'
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-vvc
          fail_ci_if_error: false
        continue-on-error: true

  # ==========================================================================
  # Job 3: Security Scanning
  # ==========================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION_PRIMARY }}
          cache: 'pip'

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit safety

      - name: Run pip-audit
        run: |
          pip-audit --require-hashes=false --ignore-vuln GHSA-xxxx-xxxx-xxxx 2>/dev/null || echo "::warning::Vulnerabilities found in dependencies"
        continue-on-error: true

      - name: Check requirements.txt with Safety
        run: |
          safety check -r requirements.txt --full-report || echo "::warning::Safety check found issues"
        continue-on-error: true

  # ==========================================================================
  # Job 4: Build Check
  # ==========================================================================
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION_PRIMARY }}
          cache: 'pip'

      - name: Build source and wheel distributions
        run: |
          python -m pip install build==1.2.2.post1
          python -m build
