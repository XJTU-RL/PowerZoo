system_ref: District_34Bus_3Zone
env:
  env_name: district_dispatch
  n_districts: 3
  max_episode_steps: 96
  use_neighbor_obs: true
  max_neighbors: 2
  v_min: 0.95
  v_max: 1.05
  soc_min: 0.1
  soc_max: 0.9
  soc_healthy_min: 0.2
  soc_healthy_max: 0.8
  soc_init: 0.5
  charge_efficiency: 0.95
  discharge_efficiency: 0.95
  base_price_yuan_kwh: 0.5
  carbon_intensity: 0.6
  carbon_price: 0.05
  reward_weights:
    economic_dispatch: 1.0
    voltage_compliance: 2.0
    loss_minimization: 0.5
    carbon_reduction: 0.3
    exchange_balance: 0.2
    storage_health: 0.1
  load_noise: true
  noise_std: 0.05
train:
  n_rollout_threads: 1
  num_env_steps: 5000000
  episode_length: 96
  eval_interval: 25
  save_interval: 25
  use_linear_lr_decay: false
  model_dir: null
eval:
  use_eval: true
  n_eval_rollout_threads: 1
model:
  lr: 3e-4
  critic_lr: 3e-4
  opti_eps: 1e-5
  weight_decay: 0
  gain: 0.01
  use_feature_normalization: true
  hidden_sizes:
  - 128
  - 128
  data_chunk_length: 24
algo:
  ppo_epoch: 10
  clip_param: 0.2
  entropy_coef: 0.01
  value_loss_coef: 1
  use_clipped_value_loss: true
  use_max_grad_norm: true
  max_grad_norm: 10.0
  use_gae: true
  gamma: 0.99
  gae_lambda: 0.95
  use_huber_loss: true
  huber_delta: 10.0
  use_policy_active_masks: true
  actor_num_mini_batch: 1
  critic_num_mini_batch: 1
