# DQN (Deep Q-Network) 单智能体算法配置
seed:
  # 是否使用指定的随机种子
  seed_specify: True
  # 随机种子值
  seed: 1

device:
  # 是否使用CUDA
  cuda: True
  # 是否设置CUDA确定性
  cuda_deterministic: True
  # torch线程数
  torch_threads: 4

train:
  # 并行环境数量
  n_rollout_threads: 1
  # 总训练步数
  total_timesteps: 100000
  # 每个episode的最大步数
  episode_length: 24
  # 日志记录间隔
  log_interval: 10
  # 评估间隔
  eval_interval: 1000
  # 模型保存目录（如果设置，则从此目录加载模型；否则随机初始化）
  model_dir: ~
  # 模型保存间隔
  save_interval: 10000

eval:
  # 是否使用评估
  use_eval: True
  # 评估环境数量
  n_eval_rollout_threads: 1
  # 每次评估的episode数量
  eval_episodes: 5
  # 是否在评估时使用确定性策略
  deterministic_eval: True

render:
  # 是否使用渲染
  use_render: False
  # 渲染的episode数量
  render_episodes: 5

# DQN特定参数
dqn:
  # 学习率
  learning_rate: 1.0e-4
  # 批次大小
  batch_size: 32
  # 经验回放缓冲区大小
  buffer_size: 1000000
  # 开始学习的步数
  learning_starts: 50000
  # 目标网络更新频率
  target_update_interval: 10000
  # 训练频率
  train_freq: 4
  # 梯度步数
  gradient_steps: 1
  # 折扣因子
  gamma: 0.99
  # tau参数（软更新）
  tau: 1.0
  # 探索策略
  exploration_fraction: 0.1
  # 初始探索率
  exploration_initial_eps: 1.0
  # 最终探索率
  exploration_final_eps: 0.05
  # 最大梯度范数
  max_grad_norm: 10

# 网络架构参数
model:
  # MLP隐藏层大小
  hidden_sizes: [64, 64]
  # 激活函数：sigmoid, tanh, relu, leaky_relu, selu
  activation_func: relu
  # 是否使用dueling网络
  dueling: True