# A2C (Advantage Actor-Critic) 单智能体算法配置
seed:
  # 是否使用指定的随机种子
  seed_specify: True
  # 随机种子值
  seed: 1

device:
  # 是否使用CUDA
  cuda: True
  # 是否设置CUDA确定性
  cuda_deterministic: True
  # torch线程数
  torch_threads: 4

train:
  # 并行环境数量
  n_rollout_threads: 1
  # 总训练步数
  total_timesteps: 100000
  # 每个episode的最大步数
  episode_length: 24
  # 日志记录间隔
  log_interval: 10
  # 评估间隔
  eval_interval: 1000
  # 是否使用线性学习率衰减
  use_linear_lr_decay: False
  # 模型保存目录（如果设置，则从此目录加载模型；否则随机初始化）
  model_dir: ~
  # 模型保存间隔
  save_interval: 10000

eval:
  # 是否使用评估
  use_eval: True
  # 评估环境数量
  n_eval_rollout_threads: 1
  # 每次评估的episode数量
  eval_episodes: 5
  # 是否在评估时使用确定性策略
  deterministic_eval: True

render:
  # 是否使用渲染
  use_render: False
  # 渲染的episode数量
  render_episodes: 5

# A2C特定参数
a2c:
  # 学习率
  learning_rate: 7.0e-4
  # 经验缓冲区大小
  n_steps: 5
  # 折扣因子
  gamma: 0.99
  # GAE lambda参数
  gae_lambda: 1.0
  # 熵系数
  ent_coef: 0.0
  # 价值函数损失系数
  vf_coef: 0.25
  # 最大梯度范数
  max_grad_norm: 0.5
  # RMSprop alpha参数
  rms_prop_eps: 1e-5
  # 是否使用RMSprop优化器
  use_rms_prop: True
  # 是否使用SDE（状态相关探索）
  use_sde: False
  # SDE采样频率
  sde_sample_freq: -1
  # 是否标准化优势
  normalize_advantage: False

# 网络架构参数
model:
  # MLP隐藏层大小
  hidden_sizes: [64, 64]
  # 激活函数：sigmoid, tanh, relu, leaky_relu, selu
  activation_func: tanh
  # 是否使用正交初始化
  use_orthogonal_init: True
  # 增益参数
  gain: 0.01