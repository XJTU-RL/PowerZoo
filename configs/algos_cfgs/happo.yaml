# HAPPO算法配置 - PowerZoo优化版本
seed:
  # 是否使用指定的种子
  seed_specify: True
  # 种子
  seed: 12345
device:
  # 是否使用CUDA
  cuda: True
  # 是否设置CUDA确定性
  cuda_deterministic: True
  # arg to torch.set_num_threads
  torch_threads: 4
train:
  # 训练数据的并行环境数量（PowerZoo推荐值）
  n_rollout_threads: 2
  # 总训练步数（PowerZoo电力系统推荐2M步）
  num_env_steps: 2000000
  # 每个环境每次训练数据的收集步数（360步=15分钟间隔*24小时）
  episode_length: 360
  # 日志间隔（每3个episode记录一次）
  log_interval: 1
  # 评估间隔（每2个episode评估一次）
  eval_interval: 2
  # 模型保存间隔（每5个episode保存一次模型）
  save_interval: 5
  # 是否使用ValueNorm
  use_valuenorm: True
  # 是否使用线性学习率衰减
  use_linear_lr_decay: False
  # 是否考虑在episode结束时截断
  use_proper_time_limits: True
  # 如果设置，从该目录加载模型；否则，随机初始化模型
  model_dir: null
eval:
  # 是否使用评估
  use_eval: True
  # 评估并行环境数量
  n_eval_rollout_threads: 2
  # 每次评估使用的episode数量
  eval_episodes: 10
render:
  # 是否使用渲染
  use_render: False
  # 要渲染的episode数量
  render_episodes: 1
model:
  # 网络参数（PowerZoo电力系统优化）
  # mlp模块在网络中的隐藏层大小（加大以处理复杂电力系统）
  hidden_sizes: [128, 128]
  # 激活函数，选择sigmoid、tanh、relu、leaky_relu、selu
  activation_func: relu
  # 是否使用特征归一化
  use_feature_normalization: True
  # 网络参数初始化方法，选择xavier_uniform_、orthogonal_等
  initialization_method: orthogonal_
  # 输出层增益（增大以提高初期探索能力）
  gain: 0.2
  # 循环参数
  # 是否使用简单的循环网络策略（训练数据不分块）
  use_naive_recurrent_policy: False
  # 是否使用循环网络策略（训练数据分块）- PowerZoo推荐启用
  use_recurrent_policy: True
  # 循环层数量
  recurrent_n: 1
  # 数据分块长度；仅当use_recurrent_policy为True时有用；episode_length必须是data_chunk_length的倍数
  data_chunk_length: 60
  # 优化器参数（PowerZoo优化）
  # 演员学习率（降低以提高稳定性）
  lr: 0.0001
  # 评论家学习率（保持稍高以快速学习价值函数）
  critic_lr: 0.0003
  # Adam中的eps
  opti_eps: 0.00001
  # Adam中的权重衰减
  weight_decay: 0.0
  # 标准差系数
  std_x_coef: 1
  # 标准差系数
  std_y_coef: 0.5
algo:
  # PPO参数（PowerZoo电力系统优化）
  # 演员更新轮数（降低以避免过拟合）
  ppo_epoch: 5
  # 评论家更新轮
  critic_epoch: 5
  # 是否使用裁剪值损失
  use_clipped_value_loss: True
  # 裁剪参数（稍微增大以提供更多探索空间）
  clip_param: 0.25
  # 每个epoch的演员更新批次
  actor_num_mini_batch: 4
  # 每个epoch的评论家更新批次
  critic_num_mini_batch: 4
  # 熵系数（增大以促进探索）
  entropy_coef: 0.08
  # 值损失系数
  value_loss_coef: 1.0
  # 是否裁剪梯度
  use_max_grad_norm: True
  # 最大梯度范数（降低以允许更大的梯度更新）
  max_grad_norm: 3.0
  # 是否使用Generalized Advantage Estimation (GAE)
  use_gae: True
  # GAE的gamma
  gamma: 0.99
  # GAE的lambda
  gae_lambda: 0.95
  # 是否使用Huber损失
  use_huber_loss: True
  # 是否使用策略激活掩码
  use_policy_active_masks: True
  # Huber损失的delta
  huber_delta: 10.0
  # 概率聚合方法，选择prod、mean
  action_aggregation: prod
  # 是否共享参数
  share_param: False
  # 是否使用固定优化顺序
  fixed_order: False
  # 是否使用sentivity 规定的优化顺序
  sentivity_order: False
logger:
  # 日志目录
  log_dir: "./results"
