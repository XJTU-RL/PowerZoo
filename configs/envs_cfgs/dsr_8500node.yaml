system_ref: 8500Node
env:
  system_name: 8500-Node
  max_episode_steps: 20
  n_dg: 15
  n_pv: 20
  n_switch: 50
  use_load_aggregation: true
  n_load_agents: 50
  load_aggregation_method: zone
  v_min: 0.95
  v_max: 1.05
  reward_restore: 20.0
  reward_voltage: 1.0
  reward_overload: 1.0
  reward_done: -5.0
  min_faults: 5
  max_faults: 10
  max_faultable_lines: 100
  line_disconnect_prob: 0.8
  log_interval_episodes: 20
  success_threshold: 0.85
  restoration_threshold: 0.9
  recent_episodes_window: 20
  pv_power_levels: 11
  load_action_levels: 2
  pv_max_power: 200.0
  obs_reserved_dim: 10
  default_voltage: 1.0
  priority_weights:
    1: 3.0
    2: 2.0
    3: 1.0
  max_priority_level: 3
  monitoring:
    visualization: false
    visualization_interval: 100
  dss_file: Master.dss
train:
  episode_length: 20
  n_rollout_threads: 4
  num_env_steps: 20000000
  eval_interval: 50
eval:
  use_eval: true
  n_eval_rollout_threads: 1
model:
  data_chunk_length: 5
  hidden_sizes:
  - 256
  - 256
  lr: 3e-4
algo:
  ppo_epoch: 5
