# 环境字段与训练参数分开；公共解析器展开一次引用。
training_ref: dsr_8500node_default
system_ref: 8500Node
env:
  system_name: 8500-Node
  max_episode_steps: 20
  n_dg: 15
  n_pv: 20
  n_switch: 50
  n_load_levels: 3
  use_load_aggregation: true
  n_load_agents: 50
  load_aggregation_method: zone
  v_min: 0.95
  v_max: 1.05
  max_load_per_step: 1000.0
  reward_restore: 20.0
  reward_voltage: 1.0
  reward_overload: 1.0
  reward_done: -5.0
  fault_scenarios: 10
  min_faults: 5
  max_faults: 10
  max_faultable_lines: 100
  line_disconnect_prob: 0.8
  use_action_mask: true
  use_dynamic_network: true
  use_render: false
  record_node: false
  load_noise: false
  scale: 1.0
  log_interval_episodes: 20
  success_threshold: 0.85
  restoration_threshold: 0.9
  recent_episodes_window: 20
  pv_power_levels: 11
  load_action_levels: 2
  pv_max_power: 200.0
  obs_reserved_dim: 10
  default_voltage: 1.0
  priority_weights:
    1: 3.0
    2: 2.0
    3: 1.0
  max_priority_level: 3
  overload_threshold: 1.0
  use_emergency_rating: false
  log_overload_details: false
  ieee123_load_count: 85
  monitoring:
    detailed_logging: false
    log_frequency: 20
    visualization: false
    anomaly_detection: true
    save_snapshots: false
    metrics_aggregation: mean
    visualization_interval: 100
    save_final_report: true
  scenario_name: ieee8500_restoration
  dss_file: Master.dss
