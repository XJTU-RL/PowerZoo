system_ref: District_34Bus_3Zone
env:
  max_episode_steps: 96
  regions:
  - name: upstream
    buses:
    - '800'
    - '802'
    - '806'
    - '808'
    - '810'
    - '812'
    - '814'
    - 814r
    - '816'
    - '818'
    - '820'
    - '822'
    - '824'
    - '826'
    - '828'
    - '830'
    - pv_bus_d0_1
    - pv_bus_d0_2
    - sourcebus
    controls:
    - PVSystem.pv_d0_1
    - PVSystem.pv_d0_2
    - Storage.ess_d0
  - name: midstream
    buses:
    - '832'
    - '834'
    - '836'
    - '838'
    - '840'
    - '842'
    - '844'
    - '846'
    - '848'
    - '850'
    - '852'
    - 852r
    - '854'
    - '856'
    - '858'
    - '860'
    - '862'
    - '864'
    - pv_bus_d1_1
    - pv_bus_d1_2
    controls:
    - PVSystem.pv_d1_1
    - PVSystem.pv_d1_2
    - Storage.ess_d1
    - Generator.svg_mid
  - name: downstream
    buses:
    - '888'
    - '890'
    - pv_bus_d2_1
    controls:
    - PVSystem.pv_d2_1
    - Storage.ess_d2
  use_neighbor_obs: true
train:
  n_rollout_threads: 1
  num_env_steps: 5000000
  episode_length: 96
  eval_interval: 25
  save_interval: 25
  use_linear_lr_decay: false
  model_dir: null
eval:
  use_eval: true
  n_eval_rollout_threads: 1
model:
  lr: 3e-4
  critic_lr: 3e-4
  opti_eps: 1e-5
  weight_decay: 0
  gain: 0.01
  use_feature_normalization: true
  hidden_sizes:
  - 128
  - 128
  data_chunk_length: 24
algo:
  ppo_epoch: 10
  clip_param: 0.2
  entropy_coef: 0.01
  value_loss_coef: 1
  use_clipped_value_loss: true
  use_max_grad_norm: true
  max_grad_norm: 10.0
  use_gae: true
  gamma: 0.99
  gae_lambda: 0.95
  use_huber_loss: true
  huber_delta: 10.0
  use_policy_active_masks: true
  actor_num_mini_batch: 1
  critic_num_mini_batch: 1
