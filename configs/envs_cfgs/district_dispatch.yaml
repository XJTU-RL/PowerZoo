# 环境字段与训练参数分开；公共解析器展开一次引用。
training_ref: district_dispatch_default
system_ref: District_34Bus_3Zone
env:
  env_name: district_dispatch
  scenario_name: 34bus_3zone_dispatch
  n_districts: 3
  connection_mode: mixed
  max_episode_steps: 96
  use_neighbor_obs: true
  max_neighbors: 2
  v_min: 0.95
  v_max: 1.05
  soc_min: 0.1
  soc_max: 0.9
  soc_healthy_min: 0.2
  soc_healthy_max: 0.8
  soc_init: 0.5
  charge_efficiency: 0.95
  discharge_efficiency: 0.95
  base_price_yuan_kwh: 0.5
  carbon_intensity: 0.6
  carbon_price: 0.05
  reward_weights:
    economic_dispatch: 1.0
    voltage_compliance: 2.0
    loss_minimization: 0.5
    carbon_reduction: 0.3
    exchange_balance: 0.2
    storage_health: 0.1
  load_noise: true
  noise_std: 0.05
  use_render: false
  debug_mode: false
  log_interval_episodes: 10
  monitoring:
    detailed_logging: true
    log_frequency: 10
    visualization: false
    save_final_report: true
