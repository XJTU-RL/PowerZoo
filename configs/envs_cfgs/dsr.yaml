env:
  max_episode_steps: 12
  control_groups:
  - name: switching
    controls:
    - Line.feed_a
    - Line.feed_b
    - Line.tie
  - name: critical
    controls:
    - Load.critical
  - name: ordinary
    controls:
    - Load.ordinary
  priorities:
    Load.critical: 3.0
train:
  n_rollout_threads: 1
  num_env_steps: 10000000
  episode_length: 24
  eval_interval: 25
  save_interval: 25
  use_linear_lr_decay: false
  model_dir: null
eval:
  use_eval: true
  n_eval_rollout_threads: 1
model:
  lr: 5e-4
  critic_lr: 5e-4
  opti_eps: 1e-5
  weight_decay: 0
  gain: 0.01
  use_feature_normalization: true
  hidden_sizes:
  - 128
  - 128
  data_chunk_length: 12
algo:
  ppo_epoch: 5
  clip_param: 0.2
  entropy_coef: 0.01
  value_loss_coef: 1
  use_clipped_value_loss: true
  use_max_grad_norm: true
  max_grad_norm: 10.0
  use_gae: true
  gamma: 0.99
  gae_lambda: 0.95
  use_huber_loss: true
  huber_delta: 10.0
  use_policy_active_masks: true
  actor_num_mini_batch: 1
  critic_num_mini_batch: 1
