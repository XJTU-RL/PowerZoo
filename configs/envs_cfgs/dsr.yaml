# DSR (Distribution System Restoration) Environment Configuration
# 配电网恢复环境配置

env_name: "dsr"
scenario_name: "ieee123_restoration"

# 基础设置
seed_specify: True
seed: 123456

# 环境参数
env_args:
  # 基础配置
  system_name: "123Bus"
  dss_file: "IEEE123Master.dss"
  max_episode_steps: 15
  
  # 设备配置
  n_dg: 7          # 柴油发电机数量（黑启动电源）
  n_pv: 9          # 光伏数量
  n_switch: 20     # 开关数量
  n_load_levels: 3 # 负荷优先级等级
  
  # 物理约束
  v_min: 0.95      # 最小电压标幺值
  v_max: 1.05      # 最大电压标幺值
  max_load_per_step: 500.0  # 每步最大恢复负荷(kW)
  
  # 奖励权重
  reward_restore: 20.0     # 负荷恢复奖励权重
  reward_voltage: 1.0      # 电压越限惩罚权重
  reward_overload: 1.0     # 线路过载惩罚权重
  reward_done: -5.0        # 失败惩罚
  
  # 故障配置
  fault_scenarios: 5       # 故障场景数量
  min_faults: 3           # 最小故障数量
  max_faults: 5           # 最大故障数量
  
  # 高级特性
  use_action_mask: True    # 是否使用动作掩码
  use_dynamic_network: True # 是否使用动态智能体网络
  use_render: False        # 是否使用渲染
  record_node: True        # 是否记录节点违规信息
  
  # PowerZoo集成配置
  load_noise: False        # 是否使用负荷噪声
  scale: 1.0              # 负荷缩放因子
  useS: False             # 是否使用敏感度矩阵
  
  # 过载检测相关配置
  overload_threshold: 1.0  # 过载阈值倍数
  use_emergency_rating: False  # 是否使用紧急额定值
  log_overload_details: False  # 是否记录过载详情
  
  # 动作空间配置
  pv_power_levels: 11      # PV功率等级数量（0-10）
  load_action_levels: 2    # 负荷动作等级数量（断开/恢复）
  pv_max_power: 150.0      # PV最大功率（kW）
  
  # 观测空间配置
  obs_reserved_dim: 10     # 智能体特定观测预留维度
  default_voltage: 1.0     # 默认电压标幺值
  
  # 设备重置配置
  line_disconnect_prob: 0.7  # 线路断开概率（重置时）
  max_faultable_lines: 50  # 最大可故障线路数量
  
  # 负荷优先级配置
  priority_weights:
    1: 3.0                 # 重要负荷权重
    2: 2.0                 # 一般负荷权重
    3: 1.0                 # 普通负荷权重
  max_priority_level: 3    # 最大优先级等级
  
  # 日志记录配置
  log_interval_episodes: 10  # 日志记录间隔（episode数）
  success_threshold: 0.9   # 成功恢复阈值（90%恢复率）
  recent_episodes_window: 10  # 最近episode窗口大小
  
  # IEEE 123节点系统配置
  ieee123_load_count: 85   # IEEE 123节点系统的典型负荷数量

# 训练参数
train_interval_episode: 1
eval_interval: 25
use_eval: True
n_eval_rollout_threads: 1
n_rollout_threads: 3
num_mini_batch: 1
episode_length: 15
num_env_steps: 10000000

# 算法通用参数
runner: "OnPolicyHARunner"
share_policy: False  # DSR使用异构智能体
use_centralized_V: True
use_obs_instead_of_state: False

# 网络参数
hidden_size: 128
layer_N: 2
use_ReLU: True
use_feature_normalization: True
use_orthogonal: True
gain: 0.01

# 训练参数
lr: 5e-4
critic_lr: 5e-4
opti_eps: 1e-5
weight_decay: 0

# PPO参数  
ppo_epoch: 5
use_clipped_value_loss: True
clip_param: 0.2
num_mini_batch: 1
entropy_coef: 0.01
value_loss_coef: 1
use_max_grad_norm: True
max_grad_norm: 10.0
use_gae: True
gamma: 0.99
gae_lambda: 0.95
use_proper_time_limits: False
use_huber_loss: True
use_value_active_masks: True
use_policy_active_masks: True
huber_delta: 10.0

# 保存和日志
save_interval: 25
use_linear_lr_decay: False
use_wandb: False
use_render: False
render_episodes: 5

# 模型目录
model_dir: null