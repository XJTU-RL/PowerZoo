system_ref: 34Bus
env:
  system_name: 34Bus
  dss_file: ieee34Mod1.dss
  max_episode_steps: 24
  n_consumer_agents: 10
  ess_config:
    total_capacity: 4.0
    initial_soc: 0.5
    efficiency_charge: 0.95
    efficiency_discharge: 0.95
    self_discharge_rate: 0.001
    max_power: 1.0
  monitoring_config:
    enable: true
    log_dir: logs/stackelberg_34bus
    save_interval: 100
    plot_interval: 50
    experiment_name: null
    track_convergence: true
    track_nash_gap: true
    track_carbon: true
  async_config:
    consumer_delay: 1
    action_persistence: 1
    enable_action_prediction: false
    partial_observability: false
    observation_noise: 0.0
  load_aggregation:
    method: zone
    use_electrical_distance: true
    zone_definitions: null
    priority_weights:
      residential: 1.0
      commercial: 2.0
      industrial: 3.0
      critical: 10.0
