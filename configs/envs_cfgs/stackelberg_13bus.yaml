# Stackelberg Game Environment Configuration for 13Bus System

# Basic environment settings
env_name: stackelberg_13bus
system_name: 13Bus
dss_file: IEEE13bus_battery_adaptive.dss
max_episode_steps: 24  # 24-hour episodes

# Agent configuration
n_consumer_agents: 8  # Number of consumer agents
consumer_bus_mapping:
  # Map consumer agents to buses
  0: [671, 675]     # Consumer 0 controls buses 671, 675
  1: [692, 611]     # Consumer 1 controls buses 692, 611  
  2: [652, 632]     # Consumer 2 controls buses 652, 632
  3: [633, 634]     # Consumer 3 controls buses 633, 634
  4: [645, 646]     # Consumer 4 controls buses 645, 646
  5: [680]          # Consumer 5 controls bus 680
  6: [684]          # Consumer 6 controls bus 684
  7: [650]          # Consumer 7 controls bus 650

# UC action space configuration
uc_action_space:
  price_signal:
    low: 0.5      # Minimum price multiplier
    high: 2.0     # Maximum price multiplier
  dr_incentive:
    low: 0.0      # Minimum DR incentive
    high: 0.5     # Maximum DR incentive
  capacity_allocation:
    low: 0.0      # Minimum capacity allocation
    high: 1.0     # Maximum capacity allocation
  ess_charge:
    low: -1.0     # Discharge (negative)
    high: 1.0     # Charge (positive)
  der_curtailment:
    low: 0.0      # No curtailment
    high: 1.0     # Full curtailment

# Consumer action space configuration
consumer_action_space:
  load_adjustment:
    low: -0.3     # Maximum load reduction (30%)
    high: 0.1     # Maximum load increase (10%)
  der_output:
    low: 0.0      # Minimum DER output
    high: 1.0     # Maximum DER output

# Observation space configuration
observation_config:
  uc_observations:
    - total_load           # System total load
    - total_generation     # Total generation
    - system_loss          # System losses
    - avg_voltage          # Average voltage
    - min_voltage          # Minimum voltage
    - max_voltage          # Maximum voltage
    - der_available        # Available DER generation
    - ess_soc             # ESS state of charge
    - hour_of_day         # Current hour (0-23)
    - day_type            # Weekday/weekend
    - load_forecast       # Next hour load forecast
    - der_forecast        # Next hour DER forecast
    - carbon_intensity    # Current carbon intensity
    - market_price        # Current market price
  
  consumer_observations:
    - uc_price_signal     # UC price signal
    - uc_dr_incentive     # UC DR incentive
    - uc_capacity_alloc   # UC capacity allocation
    - local_load          # Consumer's current load
    - local_voltage       # Local bus voltage
    - local_der_available # Local DER availability
    - neighbor_loads      # Neighboring consumer loads
    - hour_of_day         # Current hour
    - comfort_level       # Current comfort level
    - dr_participation    # Historical DR participation

# Reward weights (based on paper equations)
reward_weights:
  # UC reward components (Equations 5-10)
  uc:
    electricity_revenue: 1.0      # C_t^s weight
    market_cost: 1.0             # C_t^m weight
    der_profit: 0.8              # C_t^g weight
    dr_cost: 0.6                 # C_t^r weight
    system_loss: 0.5             # Additional loss penalty
    voltage_violation: 2.0       # Voltage violation penalty
    carbon_reduction: 0.3        # Carbon reduction bonus
  
  # Consumer reward components (Equations 21-25)
  consumer:
    electricity_cost: 1.0        # U_i,t^s weight
    comfort_loss: 0.8           # U_i,t^c weight
    dr_revenue: 1.2             # U_i,t^r weight
    voltage_quality: 0.3        # Additional voltage quality

# Physical constraints
constraints:
  voltage_min: 0.95              # Minimum voltage p.u.
  voltage_max: 1.05              # Maximum voltage p.u.
  line_capacity_factor: 0.9      # Line capacity safety factor
  max_load_change_rate: 0.1      # Maximum load change per step
  ess_ramp_rate: 0.2             # ESS max ramp rate

# Market configuration
market_config:
  base_price: 0.10               # Base electricity price ($/kWh)
  peak_multiplier: 2.0           # Peak hour price multiplier
  valley_multiplier: 0.5         # Valley hour price multiplier
  market_volatility: 0.03        # Market price volatility

# Time-of-Use configuration (from paper)
tou_config:
  peak_hours: [8, 9, 10, 11, 17, 18, 19, 20]
  valley_hours: [0, 1, 2, 3, 4, 5, 23]
  normal_hours: [6, 7, 12, 13, 14, 15, 16, 21, 22]

# Tiered pricing configuration
tier_config:
  tier_1_limit: 0.5              # First tier limit (MWh)
  tier_2_limit: 1.0              # Second tier limit (MWh)
  tier_3_limit: 2.0              # Third tier limit (MWh)
  tier_1_multiplier: 1.0         # First tier price multiplier
  tier_2_multiplier: 1.2         # Second tier price multiplier
  tier_3_multiplier: 1.5         # Third tier price multiplier
  tier_4_multiplier: 2.0         # Fourth tier price multiplier

# ESS configuration per paper
ess_config:
  total_capacity: 2.0            # Total ESS capacity (MWh)
  initial_soc: 0.5               # Initial state of charge
  efficiency_charge: 0.95        # Charging efficiency
  efficiency_discharge: 0.95     # Discharging efficiency
  self_discharge_rate: 0.001     # Self-discharge rate per hour
  min_soc: 0.2                   # Minimum SOC
  max_soc: 0.9                   # Maximum SOC
  max_power: 0.5                 # Maximum charge/discharge power (MW)

# DER configuration
der_config:
  total_capacity: 3.0            # Total DER capacity (MW)
  availability_profile: solar    # DER availability profile type
  forecast_error_std: 0.1        # DER forecast error std dev
  curtailment_cost: 0.02         # Cost of curtailing DER ($/kWh)

# DR configuration
dr_config:
  max_dr_ratio: 0.3              # Maximum DR as fraction of load
  min_response_time: 1           # Minimum response time (hours)
  fatigue_factor: 0.9            # DR fatigue factor
  participation_rate: 0.8        # Consumer participation rate

# Monitoring configuration
monitoring_config:
  enable: True
  log_dir: logs/stackelberg_13bus
  save_interval: 100
  plot_interval: 50
  experiment_name: null          # Will be auto-generated if null
  track_convergence: True
  track_nash_gap: True
  track_carbon: True

# Async execution configuration
async_config:
  consumer_delay: 1              # Consumer response delay (steps)
  action_persistence: 1          # Action persistence (steps)
  enable_action_prediction: False
  partial_observability: False
  observation_noise: 0.0

# Random seed
seed: 42

# Debug settings
debug: False
verbose: True
render: False

# Load profile configuration
load_profile_config:
  profile_type: real             # real or synthetic
  noise_level: 0.02              # Load noise level
  growth_rate: 1.02              # Annual load growth rate
  weekend_factor: 0.8            # Weekend load reduction factor

# N-1 security configuration
n1_security:
  enable: True
  critical_lines: [650632, 632670, 670671]
  contingency_probability: 0.001
  recovery_time: 4               # Hours to recover from contingency

# Carbon tracking configuration
carbon_config:
  track_emissions: True
  grid_carbon_intensity: 0.5     # kg CO2/kWh
  der_carbon_intensity: 0.0      # kg CO2/kWh
  carbon_price: 0.02             # $/kg CO2

# Training specific settings
training_config:
  curriculum_learning: True
  warmup_episodes: 100
  exploration_noise_start: 0.1
  exploration_noise_end: 0.01
  exploration_decay_episodes: 1000