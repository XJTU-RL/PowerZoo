# SmartGrid Environment Configuration
# 纯 RL 参数配置，系统配置通过 system_ref 引用加载
#
# 新配置架构 v2.0:
#   - system_ref: 引用 configs/systems/{system}.yaml
#   - training_ref: 引用 configs/training/{strategy}.yaml (可选)
#   - 此文件只包含 RL 层面的参数

# ===== 系统引用 =====
# 从 configs/systems/ 目录加载 OpenDSS 系统配置
# 可选值: 13Bus, 34Bus, 34Bus_PV, 123Bus, 8500Node
system_ref: 34Bus_PV
# PV 方案选择: none, conservative, optimized, aggressive
pv_plan: aggressive

# ===== 基础环境配置 =====
# NOTE: env_name 保留用于向后兼容，新代码应使用 system_ref
env_name: 34Bus_pv
seed: 123456

# ===== RL 环境参数 =====
episode_length: 360      # 每个 episode 的最大步数 (可覆盖系统默认值)
num_workers: null        # 并行进程数 (null = 自动)

# ===== 运行时标志 =====
useS: false              # 是否使用 S 矩阵 (SHOM 算法)
big2small: false         # 是否从大到小排序 (SHOM 算法专用)
use_render: false        # 是否渲染
record_node: false       # 是否记录节点信息
dss_act: false           # 是否使用 OpenDSS 自动控制 (打开则算法控制失效)
mode: single             # 运行模式: single, parallel, episodic, dss

# ===== 日志配置 =====
enable_system_logging: true
system_log_dir: "./logs/system_params"
log_buffer_size: 5000
log_save_interval: 50
enable_realtime_log: true

# ===== LLM 增强功能 (可选) =====
llm_enhanced: false
use_natural_language_obs: false
use_action_explanation: false

# ===== 奖励权重覆盖 (可选) =====
# 覆盖系统默认奖励权重，未指定则使用系统默认值
reward_overrides:
  power_loss: 1.0
  pv_control: 0.0606

# ===== 约束覆盖 (可选) =====
# 覆盖系统默认约束，未指定则使用系统默认值
# constraint_overrides:
#   voltage_min: 0.95
#   voltage_max: 1.05

# ===== 训练策略引用 (可选) =====
# 从 configs/training/ 目录加载训练策略
training_ref: curriculum/default

# ===== 向后兼容配置 =====
# 以下配置用于兼容旧代码，新代码应从 system_ref 获取
# NOTE: 如果同时存在 system_ref 和以下配置，system_ref 优先

# 旧格式 environment_specific (已废弃，保留用于兼容)
# 新代码应使用 configs/systems/ 中的配置
environment_specific:
  system_name: "34Bus_PV"
  dss_file: "ieee34Mod1_duty.dss"
  devices:
    capacitors:
      num: 2
      action_space: "discrete"
    regulators:
      num: 2
      action_space: "discrete"
      action_num: 33
    batteries:
      num: 2
      action_space: "discrete"
      action_num: 33
    pv_systems:
      num: 3
      control_enabled: true
      action_space: "continuous"
  reward_weights:
    power_loss: 1.0
    capacitor: 0.0303
    regulator: 0.0303
    battery_soc: 0.0
    battery_discharge: 0.303
    pv_control: 0.0606
  constraints:
    voltage_min: 0.95
    voltage_max: 1.05
    voltage_penalty_scale: 1.0
    constraint_aware: true

# 旧格式 power_system (已废弃，迁移到 training_ref)
power_system:
  voltage_violation_penalty: 50.0
  power_loss_weight: 5.0
  control_cost_weight: 0.05
  curriculum_learning: true
  phases:
    - name: "exploration_phase"
      steps: 800000
      voltage_penalty_scale: 0.3
      exploration_bonus: 0.03
    - name: "optimization_phase"
      steps: 800000
      voltage_penalty_scale: 0.7
      exploration_bonus: 0.015
    - name: "refinement_phase"
      steps: 400000
      voltage_penalty_scale: 1.0
      exploration_bonus: 0.005
  convergence:
    voltage_compliance_threshold: 0.95
    power_loss_improvement: 0.15
    policy_stability_window: 100000
    reward_std_threshold: 0.1
