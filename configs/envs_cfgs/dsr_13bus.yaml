system_ref: 13Bus
env:
  system_name: 13Bus
  max_episode_steps: 10
  n_dg: 3
  n_pv: 3
  n_switch: 10
  use_load_aggregation: false
  n_load_agents: null
  load_aggregation_method: zone
  v_min: 0.95
  v_max: 1.05
  reward_restore: 20.0
  reward_voltage: 1.0
  reward_overload: 1.0
  reward_done: -5.0
  min_faults: 1
  max_faults: 3
  pv_power_levels: 11
  load_action_levels: 2
  pv_max_power: 150.0
  obs_reserved_dim: 10
  default_voltage: 1.0
  line_disconnect_prob: 0.7
  max_faultable_lines: 20
  priority_weights:
    1: 3.0
    2: 2.0
    3: 1.0
  max_priority_level: 3
  log_interval_episodes: 10
  success_threshold: 0.9
  restoration_threshold: 0.95
  recent_episodes_window: 10
  monitoring:
    visualization: true
    visualization_interval: 20
  dss_file: IEEE13Nodeckt.dss
train:
  episode_length: 10
  n_rollout_threads: 2
  num_env_steps: 5000000
  eval_interval: 20
eval:
  use_eval: true
  n_eval_rollout_threads: 1
model:
  data_chunk_length: 5
  hidden_sizes:
  - 64
  - 64
  lr: 5e-4
algo:
  ppo_epoch: 5
