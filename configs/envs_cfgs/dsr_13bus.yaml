# 环境字段与训练参数分开；公共解析器展开一次引用。
training_ref: dsr_13bus_default
system_ref: 13Bus
env:
  system_name: 13Bus
  max_episode_steps: 10
  n_dg: 3
  n_pv: 3
  n_switch: 10
  n_load_levels: 3
  use_load_aggregation: false
  n_load_agents: null
  load_aggregation_method: zone
  v_min: 0.95
  v_max: 1.05
  max_load_per_step: 200.0
  reward_restore: 20.0
  reward_voltage: 1.0
  reward_overload: 1.0
  reward_done: -5.0
  fault_scenarios: 3
  min_faults: 1
  max_faults: 3
  use_action_mask: true
  use_dynamic_network: true
  use_render: false
  record_node: true
  load_noise: false
  scale: 1.0
  pv_power_levels: 11
  load_action_levels: 2
  pv_max_power: 150.0
  obs_reserved_dim: 10
  default_voltage: 1.0
  line_disconnect_prob: 0.7
  max_faultable_lines: 20
  priority_weights:
    1: 3.0
    2: 2.0
    3: 1.0
  max_priority_level: 3
  overload_threshold: 1.0
  use_emergency_rating: false
  log_overload_details: false
  log_interval_episodes: 10
  success_threshold: 0.9
  restoration_threshold: 0.95
  recent_episodes_window: 10
  ieee123_load_count: 85
  monitoring:
    detailed_logging: true
    log_frequency: 5
    visualization: true
    anomaly_detection: true
    save_snapshots: true
    metrics_aggregation: mean
    visualization_interval: 20
    save_final_report: true
  scenario_name: ieee13_restoration
  dss_file: IEEE13Nodeckt.dss
