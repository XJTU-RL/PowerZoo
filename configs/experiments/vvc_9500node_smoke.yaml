# IEEE 9500-Node（不平衡负荷版）冒烟实验：观测投影 + 场景按名配置示范。
# 全量观测 9943 维；邻域 k=2 投影后约 1500 维（可控设备母线 ∪ 源母线，2 跳拓扑邻域）。
# 已知特性：随机策略的极端分接/电容组合在恒功率负荷下属真实电压崩溃工况
# （实测随机组合 Newton 收敛率 8/10，均匀随机探索约 86/87 回合以崩溃收尾）。
# 环境已实现失败语义：求解失败 → 回合终止 + divergence_penalty（默认 1e4）
# 重罚 + info.physical_failure 标记，reset 自动恢复——训练不会因崩溃中断。
run:
  algo: happo
  env: vvc
  exp_name: vvc_9500node_smoke
training_ref: smoke
system_ref: 9500Node
env:
  max_episode_steps: 24
  observation_neighborhood: 2
  data:
    step_seconds: 3600
    noise: 0.0
    scenario_names: [sunny, load_imbalance]
