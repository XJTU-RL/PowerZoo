run: {algo: shom, env: vvc, exp_name: vvc_34bus_shom_native_quickstart}
system_ref: 34Bus
device: {cuda: false, torch_threads: 1}
train:
  n_rollout_threads: 1
  num_env_steps: 4
  episode_length: 4
  eval_interval: 1
eval: {use_eval: false}
model: {hidden_sizes: [32, 32], use_recurrent_policy: false}
algo:
  ppo_epoch: 1
  critic_epoch: 1
  actor_num_mini_batch: 1
  critic_num_mini_batch: 1
  sensitivity_mode: native
env:
  max_episode_steps: 4
  sensitivity_measurement: native
  data: {split: train, step_seconds: 300, noise: 0.0}
