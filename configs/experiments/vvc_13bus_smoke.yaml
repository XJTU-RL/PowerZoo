# Windows 首次训练基线：检查训练链路，不用于报告算法收敛性。
run:
  algo: happo
  env: vvc
  exp_name: win13bus
system_ref: 13Bus
seed:
  seed_specify: true
  seed: 0
device:
  cuda: false
  torch_threads: 1
train:
  n_rollout_threads: 1
  num_env_steps: 240
  episode_length: 24
eval:
  use_eval: false
model:
  hidden_sizes: [32, 32]
  use_recurrent_policy: false
  use_naive_recurrent_policy: false
algo:
  actor_num_mini_batch: 1
  critic_num_mini_batch: 1
  ppo_epoch: 1
  critic_epoch: 1
env:
  max_episode_steps: 24
  load_noise: false
