# 仅保留有运行消费者的设置；设备数量和原生额定值以DSS模型为准。
system:
  name: 34Bus
  dss_folder: node_systems/34Bus
  dss_file: ieee34Mod1_daily.dss
  source_bus: sourcebus
episode:
  max_steps: 360
devices:
  regulators:
    action_num: 33
  batteries:
    action_num: 33
constraints:
  voltage_min: 0.95
  voltage_max: 1.05
default_rewards:
  power_loss: 10.0
  capacitor: 0.0303
  regulator: 0.0303
  battery_soc: 0.0
  battery_discharge: 0.303
display:
  node_size: 500
  shift: 80
  show_node_labels: true
  load_noise: false
