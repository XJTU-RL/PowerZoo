# PowerZoo System Registry
# OpenDSS 电力系统配置注册表
#
# 使用方式：
#   在 envs_cfgs/*.yaml 中通过 system_ref 引用系统名
#   例如: system_ref: 34Bus_PV

version: "1.0"

# 基础系统列表
base_systems:
  - 13Bus
  - 34Bus
  - 123Bus
  - 8500Node

# PV 扩展系统 (通过 pv_plan 参数选择方案)
pv_systems:
  - name: 34Bus_PV
    pv_plans: [none, conservative, optimized, aggressive]

# 区域调度系统
district_systems:
  - District_34Bus_3Zone

# 系统元数据
metadata:
  13Bus:
    description: "IEEE 13-bus test feeder base configuration"
    node_count: 13
    typical_episode_length: 24

  34Bus:
    description: "IEEE 34-bus test feeder base configuration"
    node_count: 34
    typical_episode_length: 360

  34Bus_PV:
    description: "IEEE 34-bus with PV control (pv_plan selects variant)"
    node_count: 34
    typical_episode_length: 360
    pv_plans:
      none: { pv_count: 0 }
      conservative: { pv_count: 5, penetration_rate: 0.407 }
      optimized: { pv_count: 7, penetration_rate: 0.508 }
      aggressive: { pv_count: 9, penetration_rate: 0.61 }

  123Bus:
    description: "IEEE 123-bus test feeder base configuration"
    node_count: 123
    typical_episode_length: 24

  8500Node:
    description: "IEEE 8500-node test feeder base configuration"
    node_count: 8500
    typical_episode_length: 24

  District_34Bus_3Zone:
    description: "IEEE 34-bus partitioned into 3 dispatch zones with DERs"
    node_count: 34
    district_count: 3
    typical_episode_length: 96
