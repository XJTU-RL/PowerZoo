# IEEE 34-Bus with PV Control Configuration
# OpenDSS 系统配置 - 基础 PV 版本

system:
  name: 34Bus_PV
  base_system: 34Bus
  dss_folder: node_systems/34Bus_PV
  dss_file: ieee34Mod1_duty.dss
  source_bus: sourcebus

# Episode 配置
episode:
  max_steps: 360

# 设备清单
devices:
  capacitors:
    count: 2
    action_space: discrete
  regulators:
    count: 2
    action_num: 33
  batteries:
    count: 2
    action_num: 33
  pv_systems:
    count: 3
    control_enabled: true
    action_space: continuous  # 连续控制

# 物理约束
constraints:
  voltage_min: 0.95
  voltage_max: 1.05

# 默认奖励权重
default_rewards:
  power_loss: 1.0
  capacitor: 0.0303
  regulator: 0.0303
  battery_soc: 0.0
  battery_discharge: 0.303
  pv_control: 0.0606

# 显示配置
display:
  node_size: 500
  shift: 80
  show_labels: true
  show_node_labels: true
  load_noise: false

# PV 方案清单 (通过 pv_plan 参数选择)
pv_plans:
  none:
    description: "无PV系统（纯基础测试）"
    pv_count: 0
    total_capacity_kw: 0
  conservative:
    description: "保守方案（720kW, 40.7% 渗透率）"
    pv_count: 5
    total_capacity_kw: 720
    penetration_rate: 0.407
  optimized:
    description: "优化方案（900kW, 50.8% 渗透率）"
    pv_count: 7
    total_capacity_kw: 900
    penetration_rate: 0.508
  aggressive:
    description: "高渗透率方案（1080kW, 61% 渗透率）"
    pv_count: 9
    total_capacity_kw: 1080
    penetration_rate: 0.61
