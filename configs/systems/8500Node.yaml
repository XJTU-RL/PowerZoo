# 仅保留有运行消费者的设置；设备数量和原生额定值以DSS模型为准。
# network.dss 为静态快照主文件：负荷时序由场景管线驱动，无 loadshape/占位电池依赖。
system:
  name: 8500Node
  dss_folder: node_systems/8500-Node
  dss_file: network.dss
episode:
  max_steps: 24
devices:
  regulators:
    action_num: 33
constraints:
  voltage_min: 0.95
  voltage_max: 1.05
default_rewards:
  power_loss: 1.0
  capacitor: 0.0303
  regulator: 0.0303
  battery_soc: 0.0
  battery_discharge: 6.0606
