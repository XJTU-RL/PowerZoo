# HAPPO Algorithm Configuration for PowerZoo CRBP Environment
# Constraint-Aware Training Configuration for Power System Multi-Agent Control

# Algorithm Configuration
algo_name: "happo"
# Basic Configuration
seed:
  # 是否使用指定的种子
  seed_specify: True
  # 种子
  seed: 12345

# Device Configuration
device:
  # 是否使用CUDA
  cuda: True
  # 是否设置CUDA确定性
  cuda_deterministic: True
  # arg to torch.set_num_threads
  torch_threads: 4

# Training Configuration
train:
  # 训练数据的并行环境数量
  n_rollout_threads: 2
  # 总训练步数
  num_env_steps: 2000000
  # 每个环境每次训练数据的收集步数
  episode_length: 360
  # 日志间隔
  log_interval: 10000
  # 评估间隔
  eval_interval: 500
  # 模型保存间隔（每多少个episode保存一次模型）
  save_interval: 10
  # 是否使用ValueNorm
  use_valuenorm: True
  # 是否使用线性学习率衰减
  use_linear_lr_decay: False
  # 是否考虑在episode结束时截断
  use_proper_time_limits: True
  # 模型目录
  model_dir: null

# Evaluation Configuration
eval:
  # 是否使用评估
  use_eval: True
  # 评估并行环境数量
  n_eval_rollout_threads: 2
  # 每次评估使用的episode数量
  eval_episodes: 10

# Model Configuration
model:
  # 网络参数
  # mlp模块在网络中的隐藏层大小
  hidden_sizes: [128, 128]  # Larger networks for complex power systems
  # 激活函数，选择sigmoid、tanh、relu、leaky_relu、selu
  activation_func: relu
  # 是否使用特征归一化
  use_feature_normalization: True
  # 网络参数初始化方法，选择xavier_uniform_、orthogonal_等
  initialization_method: orthogonal_
  # 输出层增益
  gain: 0.01
  # 循环参数
  # 是否使用简单的循环网络策略（训练数据不分块）
  use_naive_recurrent_policy: True
  # 是否使用循环网络策略（训练数据分块）是否动作带记忆
  use_recurrent_policy: True
  # 循环层数量
  recurrent_n: 1
  # 数据分块长度；仅当use_recurrent_policy为True时有用；episode_length必须是data_chunk_length的倍数
  data_chunk_length: 60
  # 优化器参数
  # 演员学习率
  lr: 0.0003
  # 评论家学习率
  critic_lr: 0.0005
  # Adam中的eps
  opti_eps: 0.00001
  # Adam中的权重衰减
  weight_decay: 0.0
  # 标准差系数
  std_x_coef: 1
  # 标准差系数
  std_y_coef: 0.5
algo:
  # 演员更新轮数
  ppo_epoch: 15
  # 评论家更新轮
  critic_epoch: 15
  # 是否使用裁剪值损失
  use_clipped_value_loss: True
  # 裁剪参数
  clip_param: 0.2
  # 每个epoch的演员更新批次
  actor_num_mini_batch: 4
  # 每个epoch的评论家更新批次
  critic_num_mini_batch: 4
  # 熵系数
  entropy_coef: 0.01
  # 值损失系数
  value_loss_coef: 1.0
  # 是否裁剪梯度
  use_max_grad_norm: True
  # 最大梯度范数
  max_grad_norm: 5.0
  # 是否使用Generalized Advantage Estimation (GAE)
  use_gae: True
  # GAE的gamma
  gamma: 0.99
  # GAE的lambda
  gae_lambda: 0.95
  # 是否使用Huber损失
  use_huber_loss: True
  # 是否使用策略激活掩码
  use_policy_active_masks: True
  # Huber损失的delta
  huber_delta: 10.0
  # 概率聚合方法，选择prod、mean
  action_aggregation: prod
  # 是否共享参数
  share_param: False
  # 是否使用固定优化顺序
  fixed_order: False
  # 是否使用sentivity 规定的优化顺序
  sentivity_order: False
      
# Environment Configuration  
env_args:
  env_name: 34Bus_pv # choose from 13Bus 34Bus 123Bus 8500Node, 34Bus_pv for PV control
  #random seed
  seed: 123456 # 环境的seed
  #maximum number of steps
  num_steps: 24
  #number of parallel processes
  num_workers: None
  use_plot: False
  do_testing: False
  #running mode, random, parallele, episodic or dss
  mode: single
  #whether to use S
  useS: False
  # whether to order S from big to small
  # big2small参数仅用于SHOM算法
  big2small: False
  # whether to convey the information of the voltage node
  use_render: False
  record_node: False # 添加一个记录节点信息的开关
  dss_act: False # 是否使用opendss的自动求解，如果打开则算法控制失效
  
  # LLM增强功能配置
  llm_enhanced: True
  use_natural_language_obs: False
  use_action_explanation: False

  # 系统参数记录配置 (新增)
  enable_system_logging: True  # 启用系统参数记录
  system_log_dir: "./logs/system_params"  # 系统日志目录
  log_buffer_size: 5000  # 缓冲区大小
  log_save_interval: 50  # 保存间隔 (步数)
  enable_realtime_log: True  # 启用实时日志


# Power System Specific Training Configuration
power_system:
  # Constraint Penalties - Enhanced for Better Convergence
  voltage_violation_penalty: 100.0    # Strong penalty for voltage violations
  power_loss_weight: 10.0            # Weight for power loss minimization
  control_cost_weight: 0.1           # Small penalty for control actions
  
  # Training Phases - Curriculum Learning
  curriculum_learning: True
  phases:
    - name: "basic_control"
      steps: 500000
      voltage_penalty_scale: 0.5     # Start with moderate constraint
      exploration_bonus: 0.02
    
    - name: "intermediate_control"  
      steps: 1000000
      voltage_penalty_scale: 1.0     # Full constraint enforcement
      exploration_bonus: 0.01
      
    - name: "advanced_control"
      steps: 500000
      voltage_penalty_scale: 1.5     # Strict constraint for fine-tuning
      exploration_bonus: 0.005
  
  # Convergence Criteria
  convergence:
    voltage_compliance_threshold: 0.95  # 95% of time steps must satisfy voltage constraints
    power_loss_improvement: 0.15        # 15% power loss reduction target
    policy_stability_window: 100000     # Steps to check policy stability
    reward_std_threshold: 0.1           # Standard deviation threshold for convergence

# Logging and Monitoring
logger:
  # 日志目录
  log_dir: "./results"
  log_interval: 10000              # Log every 10K steps
  use_tensorboard: True           # Enable TensorBoard logging
  use_wandb: False               # Weights & Biases integration
  save_gifs: False               # Don't save GIFs (too large for power systems)
  
  # Power System Specific Metrics
  track_voltage_violations: True  # Track voltage constraint violations
  track_power_losses: True       # Track power losses over time
  track_control_costs: True      # Track control action costs
  track_pv_utilization: True     # Track PV system utilization
  
# Model Save Configuration  
save:
  save_dir: "./results/happo_powerzoo_pv"
  experiment_name: "happo_34bus_pv_constraint_aware"
  
# Resume Training (if needed)
resume:
  use_resume: False
  resume_path: ""
  
# Debug and Visualization
debug:
  use_render: False              # No rendering during training
  render_episodes: False         # No episode rendering
  ifi: 0.1                      # Interface interval

# Render Configuration
render:
  # whether to use render
  use_render: False
  # number of episodes to render
  render_episodes: 10