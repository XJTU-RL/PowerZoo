# Codecov Configuration for PowerZoo
# ============================================================================

coverage:
  precision: 2
  round: down
  range: "60...90"

  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        target: 80%
        informational: true

parsers:
  gcov:
    branch_detection:
      conditional: yes
      loop: yes
      method: no
      macro: no

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: true

ignore:
  - "tests/**/*"
  - "**/test_*.py"
  - "**/__init__.py"
  - "node_systems/**/*"
  - "data/**/*"
  - "results/**/*"
  - "docs/**/*"
  - "tools/**/*"
  - "examples/**/*"
