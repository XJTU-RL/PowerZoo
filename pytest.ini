[pytest]
# PyTest configuration for PowerZoo

# Test discovery
testpaths = tests envs
python_files = test_*.py *_test.py
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    -ra

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    stackelberg: marks tests for Stackelberg environment
    opendss: marks tests that require OpenDSS

# Timeout (optional, requires pytest-timeout)
# timeout = 300

# Ignore patterns
norecursedirs =
    .git
    .github
    __pycache__
    *.egg-info
    build
    dist
    node_systems
    data
    results
    logs

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
