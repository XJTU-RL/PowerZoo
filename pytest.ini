[pytest]
# PowerZoo pytest configuration
# ============================================================================

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
	-v
	--strict-markers
	--tb=short
	--cov=envs
	--cov=algorithms
	--cov=runners
	--cov=utils
	--cov=common
	--cov=models
	--cov-report=term-missing
	--cov-report=html:htmlcov
	--cov-report=xml

# Markers for test categorization
markers =
	unit: Unit tests (fast, isolated)
	integration: Integration tests (slower, requires system dependencies)
	slow: Slow tests (requires full environment setup)
	powerzoo: Tests specific to PowerZoo environment
	powerzoo_llm: Tests specific to PowerZoo_LLM environment
	requires_opendss: Tests requiring OpenDSS installation
	requires_gpu: Tests requiring GPU/CUDA

# Warnings
filterwarnings =
	error
	ignore::UserWarning
	ignore::DeprecationWarning
	ignore::PendingDeprecationWarning

# Logging
log_cli = false
log_cli_level = INFO
log_file = tests/pytest.log
log_file_level = DEBUG

# Coverage settings
[coverage:run]
source = envs,algorithms,runners,utils,common,models
omit =
	*/tests/*
	*/test_*.py
	*/__init__.py

[coverage:report]
precision = 2
skip_empty = true
exclude_lines =
	pragma: no cover
	def __repr__
	raise AssertionError
	raise NotImplementedError
	if __name__ == .__main__.:
	if TYPE_CHECKING:
	@abstractmethod
