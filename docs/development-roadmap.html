<!doctype html>

<head>
<meta charset="utf-8">

<style>
:root{--bg:#0d1419;--surface:#141f26;--fg:#edf5f6;--muted:#a8bec3;--line:#34474e;--aqua:#69e1d1;--done:#a3dfa6;--wait:#f2c57c;color-scheme:dark}
@media(prefers-color-scheme:light){:root{--bg:#f4f8f7;--surface:#fff;--fg:#142824;--muted:#47635e;--line:#b6c9c4;--aqua:#126b62;--done:#26713d;--wait:#874a06;color-scheme:light}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:100%/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:65rem;margin:auto;padding:clamp(1.2rem,5vw,4.5rem) clamp(1rem,4vw,2.4rem)}
header{display:flex;align-items:end;justify-content:space-between;gap:1rem;margin:0 0 1.25rem}
.brand{color:var(--aqua);font:700 .9rem/1.5 ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase}
h1{font-size:clamp(1.85rem,5vw,3.4rem);line-height:1.15;margin:.28rem 0 0;letter-spacing:-.04em}
.date{font-size:.875rem;color:var(--muted);white-space:nowrap;margin:0}
.board{background:var(--surface);border:1px solid var(--line);border-radius:1rem;overflow:hidden}
.lane{display:grid;grid-template-columns:minmax(9rem,1fr) minmax(0,3.6fr);gap:1rem;align-items:center;padding:.72rem 1rem}
.lane+.lane{border-top:1px solid var(--line)}
h2{font-size:1rem;line-height:1.3;margin:0;font-weight:680}
.status{display:block;font-size:.875rem;color:var(--muted);margin-top:.28rem}
.work,.plan{color:var(--aqua)}.discussion,.change{color:var(--muted)}.done{color:var(--done)}.wait{color:var(--wait)}.plain{color:var(--muted)}
.track{min-width:0;overflow-x:auto;scrollbar-width:thin}.event-list{min-width:calc(var(--count) * 3.35rem);position:relative;list-style:none;padding:0;margin:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);align-items:start;text-align:center}
.event-list::before{content:"";position:absolute;left:calc(50% / var(--count));right:calc(50% / var(--count));top:1rem;transform:translateY(-50%);height:2px;background:var(--line)}
li{min-width:0}
.node{width:100%;min-height:2.8rem;padding:0 .2rem .1rem;color:inherit;background:none;border:0;cursor:pointer;font:inherit;text-align:center;position:relative;display:grid;justify-items:center;align-content:start;border-radius:.5rem}
.node:hover{background:color-mix(in srgb,var(--aqua) 8%,transparent)}
.dot{display:block;width:.64rem;height:.64rem;box-sizing:content-box;border:2px solid currentColor;background:var(--surface);border-radius:50%;margin:.55rem 0 .33rem}
.current .dot{background:currentColor;box-shadow:0 0 0 .22rem color-mix(in srgb,currentColor 22%,transparent)}
.plan .dot,.discussion .dot{background:var(--surface);border-style:dashed}.change .dot{border-radius:2px}.node-label{font-size:.875rem;line-height:1.2;color:var(--fg);overflow-wrap:anywhere}
.old .node-label{color:var(--muted)}
button:focus-visible,a:focus-visible{outline:2px solid var(--aqua);outline-offset:2px}
footer{margin:.8rem 0 0;color:var(--muted);font-size:.875rem}
dialog{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:1rem;width:min(30rem,calc(100% - 2rem));padding:1.2rem;box-shadow:0 20px 85px #0005}
dialog::backdrop{background:#0009}
.dialog-top{display:flex;align-items:center;justify-content:space-between;gap:.7rem}
dialog h2{font-size:1.35rem;margin:.55rem 0}.dialog-meta{font-size:.875rem;color:var(--muted)}
.close{border:1px solid var(--line);background:none;color:var(--fg);border-radius:.45rem;min-height:2.75rem;padding:0 .8rem;font:inherit;cursor:pointer}
dialog p{margin:.6rem 0}dialog a{color:var(--aqua)}
@media(max-width:38rem){main{padding-top:1.35rem}header{align-items:start}.date{font-size:.8125rem;padding-top:.2rem}.lane{grid-template-columns:minmax(5.8rem,.9fr) minmax(0,2.6fr);padding:.65rem .65rem;gap:.3rem}.node-label{font-size:.875rem}.node{padding-inline:.1rem}.status{font-size:.875rem}}
</style>
</head>

<header><div><div class="brand">PowerZoo</div><h1>开发路线</h1></div><p class="date" id="updated"></p></header>
<section class="board" id="board" aria-label="开发泳道"></section>
<footer>点开节点看详情。讨论、计划、调整与验收分别标注。</footer>
<noscript>请在浏览器中打开此 HTML，以使用可点击的时间线。</noscript>
</main>
<dialog id="detail" aria-labelledby="event-title">
 <div class="dialog-top"><span class="dialog-meta" id="event-meta"></span><form method="dialog"><button class="close" type="submit">关闭</button></form></div>
 <h2 id="event-title"></h2><p id="event-result"></p><p id="event-next"></p><a id="event-link" hidden>公开记录</a>
</dialog>

<script>
const $=(id)=>document.getElementById(id);
const data=JSON.parse($("roadmap-data").textContent);
$("updated").textContent="更新 "+data.updated;
const dialog=$("detail"), board=$("board");
function el(tag,text,cls){const n=document.createElement(tag);if(text)n.textContent=text;if(cls)n.className=cls;return n}
function openEvent(lane,event){
 $("event-meta").textContent=lane.name+" · "+event.date+" · "+event.status;
 $("event-title").textContent=event.label;
 $("event-result").textContent=event.result;
 $("event-next").textContent=event.next?"下一步："+event.next:"";
 $("event-next").hidden=!event.next;
 const link=$("event-link");link.hidden=!event.url;
 if(event.url)link.href=event.url;else link.removeAttribute("href");
 if(!dialog.open)dialog.showModal();
}
for(const lane of data.lanes){
 const line=el("article",null,"lane"), name=el("div"), last=lane.events[lane.events.length-1];
 name.append(el("h2",lane.name),el("span",last.status,"status "+last.state));
 const list=el("ol",null,"event-list");list.style.setProperty("--count",lane.events.length);
 for(const [i,event] of lane.events.entries()){
  const item=el("li"), b=el("button",null,"node "+event.state+" "+(i===lane.events.length-1?"current":"old"));
  b.type="button";b.id=event.id;b.setAttribute("aria-label",lane.name+"："+event.label+"，"+event.status);
  const dot=el("span",null,"dot");dot.setAttribute("aria-hidden","true");
  b.append(dot,el("span",event.label,"node-label"));b.onclick=()=>openEvent(lane,event);
  item.append(b);list.append(item);
 }
 const track=el("div",null,"track");track.append(list);line.append(name,track);board.append(line);
 if(lane.events.length>4)track.scrollLeft=track.scrollWidth;
}
dialog.addEventListener("click",e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}});
</script>
